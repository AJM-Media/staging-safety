name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, ${{ matrix.install }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', wp: '6.0', install: single }
          - { php: '8.1', wp: '6.0', install: single }
          - { php: '8.3', wp: '6.0', install: single }
          - { php: '7.4', wp: latest, install: single }
          - { php: '8.1', wp: latest, install: single }
          - { php: '8.3', wp: latest, install: single }
          - { php: '8.3', wp: latest, install: multisite }
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
        env:
          PHP_VERSION: ${{ matrix.php }}
          WP_VERSION: ${{ matrix.wp }}
          INSTALL: ${{ matrix.install }}
